name: BEASTLOOP Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile for Windows
    runs-on: windows-latest

    steps:
      # Get the repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install Haxe
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5

      # Verify the environment
      - name: Check Haxe installation
        run: |
          haxe --version
          haxelib version
          git --version

      # Create a project-local Haxelib repository
      - name: Setup Haxelib
        shell: pwsh
        run: |
          $Repo = "$env:GITHUB_WORKSPACE\.haxelib"

          New-Item -ItemType Directory -Force -Path $Repo | Out-Null
          haxelib setup $Repo

      # Install the exact dependencies used by BEASTLOOP
      - name: Install Haxelibs
        shell: pwsh
        run: |
          $Libraries = @(
            @{ Name = 'lime';          Version = '7.9.0' },
            @{ Name = 'openfl';        Version = '9.1.0' },
            @{ Name = 'hxcpp';         Version = '4.2.1' },
            @{ Name = 'flixel';        Version = '4.11.0' },
            @{ Name = 'flixel-addons'; Version = '2.11.0' },
            @{ Name = 'flixel-ui';     Version = '2.3.3' },
            @{ Name = 'hscript';       Version = '2.4.0' },
            @{ Name = 'newgrounds';    Version = '1.1.5' },
            @{ Name = 'haxeui-core';   Version = '1.7.0' },
            @{ Name = 'haxeui-flixel'; Version = '1.7.0' }
          )

          foreach ($Library in $Libraries) {
            Write-Host "Installing $($Library.Name) $($Library.Version)..."

            haxelib install $Library.Name $Library.Version
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install $($Library.Name)."
            }

            haxelib set $Library.Name $Library.Version
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to activate $($Library.Name)."
            }
          }

      # Install the pinned Polymod revision
      - name: Install Polymod
        run: haxelib git polymod https://github.com/larsiusprime/polymod.git 3204f48

      # Ensure APIStuff.hx is in the source directory
      - name: Prepare source files
        shell: pwsh
        run: |
          $Source = Join-Path $env:GITHUB_WORKSPACE 'source'
          $ApiFile = Join-Path $Source 'APIStuff.hx'
          $RootApiFile = Join-Path $env:GITHUB_WORKSPACE 'APIStuff.hx'

          if (!(Test-Path $ApiFile)) {
            if (!(Test-Path $RootApiFile)) {
              throw 'APIStuff.hx was not found.'
            }

            New-Item -ItemType Directory -Force -Path $Source | Out-Null
            Copy-Item $RootApiFile $ApiFile
          }

      # Compile BEASTLOOP
      - name: Build BEASTLOOP
        run: |
          haxelib run lime build windows -debug

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Upload the compiled game
      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: BEASTLOOP-Windows-Debug
          path: export/debug/windows/bin/
          if-no-files-found: error
          retention-days: 14